name: film-sync

# Merges every recent content-only branch into main (tools/mergebranches.sh: structure-aware JSON
# merge, append-only logs keep both sides), keeps every film in step with its story folder
# (tools/storysync.py), makes a still for every take that has none, then keeps the live site in
# step with main. Runs after
# every stories-sync run and on pushes to main, always with main's copy of this file, so work from
# a session whose branch is out of date still reaches the site.

on:
  # Every branch push with content starts it directly (one run per push: the old stories-sync
  # trigger job cost an extra billed minute per push). Branches made before 2026-11-20 still carry
  # stories-sync.yml with a push trigger: workflow_run keeps them working until they end.
  push:
    paths: ["stories/**", "films/**", "films-index.json", "tools/storysync.py", "tools/mergebranches.sh",
            "tools/jsonmerge.py", ".github/workflows/film-sync.yml"]
  workflow_run:
    workflows: [stories-sync]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: film-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/stories/*/*
            /stories/*/screenplay.fountain
            /stories/*/takes/
            /stories/*/prompts/
            /stories/*/elements.md
            /stories/*/animatic/
            !/stories/*/animatic/*
            /stories/*/animatic/refs_d*/
            !/stories/*/animatic/refs_d*_motion/
            !/docs/reference/

      - name: Merge content branches, sync films with their stories
        id: sync
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash tools/mergebranches.sh
          python3 tools/storysync.py
          # a still for every take that has none (ffmpeg installed only when one is needed)
          for d in films/*/; do
            [ -f "$d/film.json" ] || continue
            # the install is capped: a slow mirror once held it 17 minutes (2026-11-20, billed)
            python3 tools/media/preview.py "$d" --all || {
              [ $? -eq 3 ] && timeout 120 sudo apt-get update -qq \
                && timeout 180 sudo apt-get install -y -qq ffmpeg >/dev/null \
                && python3 tools/media/preview.py "$d" --all
            } || echo "Stills not made this run: the next run tries again."
          done
          if [ -n "$(git status --porcelain -- films films-index.json)" ]; then
            python3 tools/filmtool.py check
            git add films films-index.json
            git commit -q -m "films: synced from stories (shots, takes)"
          fi
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            pushed=0
            for i in 1 2 3; do
              git push -q origin HEAD:main && { pushed=1; break; }
              git fetch -q origin main && git merge -q --no-edit origin/main
            done
            [ "$pushed" = 1 ] || { echo "Could not push to main, the next run retries."; exit 1; }
          fi
          live=$(curl -fsS "https://filmai-6sp.pages.dev/data/site.json" | python3 -c "import sys,json;print(json.load(sys.stdin).get('commit',''))" || true)
          if [ -z "$live" ] || ! git cat-file -e "$live^{commit}" 2>/dev/null \
             || [ -n "$(git diff --name-only "$live" HEAD -- films tools/site site.json)" ]; then
            echo "deploy=1" >> "$GITHUB_OUTPUT"
            echo "Site is behind main (live build: ${live:-unknown})."
          else
            echo "Site already shows main (live build: $live)."
          fi

      # In this job, not a separate one: Actions bills every job rounded up to a whole minute.
      - name: Build and deploy the site
        if: steps.sync.outputs.deploy == '1' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          GITHUB_SHA=$(git rev-parse HEAD) python3 tools/site/build.py --out dist
          npx --yes wrangler@4.151.2 pages deploy "$GITHUB_WORKSPACE/dist" --cwd tools/site --project-name=filmai --branch=main --commit-dirty=true
