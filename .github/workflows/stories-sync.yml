name: stories-sync

# The push trigger for working branches. When it finishes, film-sync.yml (always main's copy)
# merges every recent branch that changes only stories/, films/ and films-index.json into main,
# syncs the films and deploys the site. A branch with other changes goes through a pull request.

on:
  push:
    branches-ignore: [main]
    paths: ["stories/**", "films/**", "films-index.json"]

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - run: echo "film-sync merges ${{ github.ref_name }} into main if it changes only content."
