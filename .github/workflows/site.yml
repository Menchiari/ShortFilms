name: site

# Manual only (Leonard 2026-11-20: no workflow starts on a push). film-sync deploys the site on
# its clock whenever the live build is behind main.
on:
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Takes are checked out (the site plays them). Other heavy media (sfx, music, edit) is not.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/films/*/06-sound/sfx/
            !/films/*/07-music/takes/
            !/films/*/07-music/input/
            !/films/*/08-edit/
            !/films/*/_local/
            !/docs/reference/
            !/stories/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check films
        run: python3 tools/filmtool.py check || echo "check reported problems (media folders are not checked out here)"

      - name: Build site
        run: python3 tools/site/build.py --out dist

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          npx --yes wrangler@4.151.2 pages project create filmai --production-branch=main || true
          # --cwd: wrangler takes the Pages Functions from tools/site/functions (video byte ranges)
          npx --yes wrangler@4.151.2 pages deploy "$GITHUB_WORKSPACE/dist" --cwd tools/site --project-name=filmai --branch=main --commit-dirty=true

      - name: Deploy skipped
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "Cloudflare secrets not set yet. Site built but not deployed. See docs/WEBSITE.md."
